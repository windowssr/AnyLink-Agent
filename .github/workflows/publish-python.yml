name: Python SDK / Trusted Publishing
on:
  push:
    branches: [main]
    tags: ['python-v*']
    paths:
      - 'sdk-python/**'
      - 'scripts/check-python-release.py'
      - '.github/workflows/publish-python.yml'
  pull_request:
    paths:
      - 'sdk-python/**'
      - 'scripts/check-python-release.py'
      - '.github/workflows/publish-python.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: sdk-python/pyproject.toml
      - name: Install SDK and test dependencies
        run: python -m pip install -e './sdk-python[dev]'
      - name: Run Python SDK tests
        run: python -m pytest sdk-python/tests

  build:
    name: Build and verify distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check SDK version and release tag
        run: python scripts/check-python-release.py
      - name: Install packaging tools
        run: python -m pip install build twine
      - name: Build wheel and source archive
        run: python -m build sdk-python --outdir sdk-python/dist
      - name: Check package metadata and contents
        run: |
          python -m twine check sdk-python/dist/*
          python scripts/check-python-release.py --dist sdk-python/dist
      - name: Install and import the built wheel in isolation
        run: |
          python -m venv "$RUNNER_TEMP/python-wheel-smoke"
          "$RUNNER_TEMP/python-wheel-smoke/bin/python" -m pip install sdk-python/dist/*.whl
          "$RUNNER_TEMP/python-wheel-smoke/bin/python" -c 'import anylink, importlib.metadata, pathlib, sys; assert anylink.__version__ == importlib.metadata.version("anylink-agent"); assert pathlib.Path(anylink.__file__).resolve().is_relative_to(pathlib.Path(sys.prefix)); print("Built wheel import and version: OK")'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: |
            sdk-python/dist/*.whl
            sdk-python/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/python-v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/anylink-agent
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist
          digest-mismatch: error
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
