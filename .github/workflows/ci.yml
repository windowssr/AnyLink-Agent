name: Protocol and SDK
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: anylink
          POSTGRES_PASSWORD: anylink-test-only-password
          POSTGRES_DB: anylink_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U anylink -d anylink_test" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://anylink:anylink-test-only-password@127.0.0.1:5432/anylink_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run protocol:check
      - run: npm run test:sdk
      - run: npm run test:integration
      - run: npm run build
      - run: npm pack ./sdk --dry-run
