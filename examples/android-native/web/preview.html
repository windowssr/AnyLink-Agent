<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnyLink · Android 体验预览</title><link rel="stylesheet" href="./preview.css"></head>
<body data-phase="idle">
<p class="preview-note">Android 界面演示 · 使用本地语音样本，不录音、不连接设备、不发送任务</p>
<main class="phone" id="phone">
 <iframe id="portrait" src="./avatar/portrait.html" title="大肥鱼半身形象"></iframe>
 <header class="glass-header">
  <div><h1>大肥鱼</h1><span class="connection"><i></i>陪伴与协作</span></div>
  <div class="header-actions">
   <button id="call-button" class="chip"><svg><use href="./icons/sprite.svg#phone"/></svg>通话</button>
   <button id="results-button" class="icon-button" aria-label="任务记录"><svg><use href="./icons/sprite.svg#tasks"/></svg></button>
   <button id="settings-button" class="icon-button" aria-label="语音设置"><svg><use href="./icons/sprite.svg#settings"/></svg></button>
  </div>
 </header>
 <div class="stage-spacer"><span class="phase-pill" id="state-label">在这里，随时听你说</span></div>
 <section class="glass-sheet" id="glass-sheet">
  <div class="sheet-bar"><span class="drag-handle"></span><div class="sheet-bar-row"><button id="mode-toggle" class="mode-pill">展开阅读<svg><use href="./icons/sprite.svg#chevron"/></svg></button><span>对话与文件</span></div></div>
  <div class="chat-feed" id="chat-feed">
   <div class="bubble user">把今天的周报发到手机上，我看一下。</div>
   <div class="bubble assistant"><div class="meta">大肥鱼</div><p>收到啦，主人。文件就在下面，点一下就能预览。</p></div>
   <article class="file-card">
    <div class="file-heading"><svg><use href="./icons/sprite.svg#file"/></svg><div><strong>项目周报.pdf</strong><small>来自 home-mac · 1.50 MB</small></div><svg class="file-check"><use href="./icons/sprite.svg#check"/></svg></div>
    <button class="file-thumbnail" id="file-preview" aria-label="预览项目周报 PDF"><img src="./demo-report.svg" alt="项目周报 PDF 首页缩略图"><span>PDF 首页 · 点击预览</span></button>
    <div class="file-footer"><small>已保存至 下载/AnyLink</small><button id="file-open">打开文件</button><button id="file-share" aria-label="分享文件"><svg><use href="./icons/sprite.svg#share"/></svg></button></div>
   </article>
  </div>
  <div id="recording" class="recording" hidden><span class="record-dot"></span><span id="transcript">语音输入状态演示</span><button id="finish-recording">说完了</button><button id="cancel-recording" aria-label="取消录音"><svg><use href="./icons/sprite.svg#close"/></svg></button></div>
  <form class="composer" id="composer">
   <button type="button" class="icon-button" id="attachment-button" aria-label="选择附件"><svg><use href="./icons/sprite.svg#attachment"/></svg></button>
   <input id="draft" placeholder="说点什么，或交给我办件事…" aria-label="消息内容" maxlength="500">
   <button type="button" id="voice-button" class="voice-button" aria-label="语音输入"><svg><use href="./icons/sprite.svg#mic"/></svg></button>
   <button type="submit" class="send-button" aria-label="发送消息"><svg><use href="./icons/sprite.svg#send"/></svg></button>
  </form>
 </section>
 <section id="call-screen" class="call-screen" hidden aria-label="语音通话预览">
  <header class="call-header"><h2>大肥鱼</h2><p>语音通话 · 布局预览</p><time id="call-timer">00:00</time></header>
  <button id="call-stage" class="call-stage" aria-label="点人物打断播报"></button>
  <div class="call-bottom">
   <p class="call-status" id="call-status">正在听你说</p>
   <p class="call-caption" id="call-caption">可以播放下方语音样本，检查动作和口型。</p>
   <div class="call-actions">
    <button id="mute-button" class="call-action"><span><svg><use href="./icons/sprite.svg#mic"/></svg></span><small>静音</small></button>
    <button id="hangup-button" class="call-action hangup"><span><svg><use href="./icons/sprite.svg#phone-off"/></svg></span><small>挂断</small></button>
    <button id="route-button" class="call-action"><span><svg><use href="./icons/sprite.svg#earpiece"/></svg></span><small>听筒</small></button>
   </div>
  </div>
 </section>
 <aside id="notice" class="notice" role="status" hidden></aside>
 <dialog id="file-dialog"><header><strong>项目周报.pdf</strong><button id="close-file" class="icon-button" aria-label="关闭文件预览"><svg><use href="./icons/sprite.svg#close"/></svg></button></header><img src="./demo-report.svg" alt="项目周报 PDF 首页"><p>此处为演示文件。原生 App 从本地文件生成预览。</p></dialog>
</main>
<nav class="preview-controls" aria-label="界面状态检查">
 <button id="play-sample"><svg><use href="./icons/sprite.svg#play"/></svg>播放语音与口型</button>
 <button data-phase="idle">陪伴</button><button data-phase="listening">倾听</button><button data-phase="thinking">思考</button><button data-phase="attention">需要确认</button>
</nav>
<audio id="speech-sample" controls preload="auto" src="./preview-speech.mp3" aria-label="语音演示样本"></audio>
<p id="sample-status" class="preview-note">口型按实际播放音量驱动；声音停止时闭嘴。</p>
<script src="./preview.js"></script></body></html>
