<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnyLink 大肥鱼</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;pointer-events:none}
canvas{position:relative;display:block;width:100%;height:100%;opacity:0;transform-origin:50% 92%;z-index:2}
#portal{position:absolute;inset:12% 19% 5%;border-radius:50%;opacity:0;transform:scale(.8);transition:opacity .4s,transform .6s;background:radial-gradient(ellipse,#edffffa6 0%,#70d9fb66 36%,#42b3ee33 57%,transparent 72%);filter:drop-shadow(0 0 12px #69d8ff);z-index:1}
#portal::before,#portal::after{content:"";position:absolute;inset:5%;border:2px solid #a6efffe6;border-radius:50%;box-shadow:inset 0 0 14px #65cfff,0 0 18px #65cfff;transform:rotate(-16deg)}
#portal::after{inset:10% -5%;border:1px solid #d6faffb3;transform:rotate(16deg)}
body.entering #portal{opacity:1;transform:scale(1)}
body.reduced #portal{display:none}
</style></head>
<body><div id="portal" aria-hidden="true"></div><script src="../core/live2dcubismcore.min.js"></script><script src="vendor/pixi.min.js"></script><script src="vendor/cubism4-colors.min.js"></script><script src="app.js"></script></body></html>
