<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071521"/>
      <stop offset="100%" stop-color="#0d263b"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#103654"/>
      <stop offset="100%" stop-color="#0b2438"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1L9 5L0 9Z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1200" height="620" rx="22" fill="url(#bg)"/>
  <g stroke="#38bdf8" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200"/>
    <path d="M150 0V620M300 0V620M450 0V620M600 0V620M750 0V620M900 0V620M1050 0V620"/>
  </g>

  <!-- Title -->
  <text x="600" y="48" text-anchor="middle" fill="#f0f9ff" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="24" font-weight="700">AnyLink Protocol v3 · Personal Agent Network Architecture</text>
  <text x="600" y="74" text-anchor="middle" fill="#7dd3fc" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14">Edge Autonomy  ·  Cloud Memory Brain  ·  Multi-Model Gateway  ·  WebSocket Real-Time Bus</text>

  <!-- Cloud Hub -->
  <rect x="110" y="102" width="980" height="224" rx="18" fill="url(#hub)" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="2"/>
  <rect x="130" y="118" width="186" height="26" rx="13" fill="#0ea5e9" fill-opacity="0.22" stroke="#38bdf8" stroke-opacity="0.5"/>
  <text x="223" y="136" text-anchor="middle" fill="#bae6fd" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600">SELF-HOSTED CLOUD HUB</text>
  <text x="334" y="136" fill="#e0f2fe" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="650">AnyLink Server (Fastify + PostgreSQL)</text>

  <!-- 3 Cloud Modules -->
  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <!-- Cloud Memory Brain -->
    <rect x="132" y="158" width="298" height="146" rx="14" fill="#081e30" stroke="#22d3ee" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="152" y="186" fill="#67e8f9" font-size="16" font-weight="700">1. Cloud Memory Brain</text>
    <text x="152" y="210" fill="#cbd5e1" font-size="13">• Hybrid CJK/Latin + Vector Assembly</text>
    <text x="152" y="232" fill="#cbd5e1" font-size="13">• Debounced Batch Consolidation</text>
    <text x="152" y="254" fill="#cbd5e1" font-size="13">• Global / Device / Agent Scopes</text>
    <text x="152" y="276" fill="#38bdf8" font-size="13" font-weight="600">• Auto Device-Boundary Learning</text>
    <text x="152" y="295" fill="#64748b" font-size="11">/edge/v1/memory/assemble · /ingest</text>

    <!-- Multi-Model Gateway -->
    <rect x="451" y="158" width="298" height="146" rx="14" fill="#081e30" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="471" y="186" fill="#7dd3fc" font-size="16" font-weight="700">2. Multi-Model Gateway</text>
    <text x="471" y="210" fill="#cbd5e1" font-size="13">• OpenAI-Compatible JSON &amp; SSE</text>
    <text x="471" y="232" fill="#cbd5e1" font-size="13">• Multi-Provider Models &amp; Aliases</text>
    <text x="471" y="254" fill="#cbd5e1" font-size="13">• Per-Agent Concurrency Control</text>
    <text x="471" y="276" fill="#38bdf8" font-size="13" font-weight="600">• Optional Auto-Memory Mode (1A)</text>
    <text x="471" y="295" fill="#64748b" font-size="11">/model/v1/chat/completions · /models</text>

    <!-- WebSocket Task Bus -->
    <rect x="770" y="158" width="298" height="146" rx="14" fill="#081e30" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="790" y="186" fill="#7dd3fc" font-size="16" font-weight="700">3. Real-Time WebSocket Bus</text>
    <text x="790" y="210" fill="#cbd5e1" font-size="13">• Live Online Presence (ws_online)</text>
    <text x="790" y="232" fill="#cbd5e1" font-size="13">• Capability-Free Invoke + @slug</text>
    <text x="790" y="254" fill="#cbd5e1" font-size="13">• Live Progress &amp; Completion Push</text>
    <text x="790" y="276" fill="#38bdf8" font-size="13" font-weight="600">• Lease Heartbeats &amp; Crash Safety</text>
    <text x="790" y="295" fill="#64748b" font-size="11">/edge/v1/ws · /edge/v1/tasks</text>
  </g>

  <!-- Protocol Strip -->
  <rect x="190" y="352" width="820" height="32" rx="16" fill="url(#accent)" fill-opacity="0.16" stroke="#38bdf8" stroke-opacity="0.6"/>
  <text x="600" y="373" text-anchor="middle" fill="#e0f2fe" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="600">AnyLink Protocol v3.0  (WebSocket Bi-Directional + OpenAPI 3.1 HTTP + OpenAI-Compatible Model Stream)</text>

  <!-- Connectors -->
  <g stroke="#38bdf8" stroke-width="2" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <path d="M225 326V352M475 326V352M725 326V352M975 326V352"/>
    <path d="M180 384V426M460 384V426M740 384V426M1020 384V426"/>
  </g>

  <!-- 4 Edge Nodes -->
  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <!-- Mac -->
    <rect x="60" y="430" width="245" height="140" rx="14" fill="#0d2336" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="80" y="458" fill="#f0f9ff" font-size="15" font-weight="700">macOS · @home-mac</text>
    <text x="80" y="482" fill="#94a3b8" font-size="12.5">OpenClaw Reference Client</text>
    <text x="80" y="504" fill="#cbd5e1" font-size="12.5">• Local files, terminal, desktop pet</text>
    <text x="80" y="524" fill="#cbd5e1" font-size="12.5">• Host-owned safety policy</text>
    <text x="80" y="552" fill="#38bdf8" font-size="11.5" font-weight="600">@anylink-agent/sdk (npm)</text>

    <!-- Android -->
    <rect x="338" y="430" width="245" height="140" rx="14" fill="#0d2336" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="358" y="458" fill="#f0f9ff" font-size="15" font-weight="700">Android · @my-phone</text>
    <text x="358" y="482" fill="#94a3b8" font-size="12.5">Native Companion App</text>
    <text x="358" y="504" fill="#cbd5e1" font-size="12.5">• Voice, Live2D floating overlay</text>
    <text x="358" y="524" fill="#cbd5e1" font-size="12.5">• On-device accessibility tools</text>
    <text x="358" y="552" fill="#38bdf8" font-size="11.5" font-weight="600">Independent Kotlin Agent</text>

    <!-- Linux / Python -->
    <rect x="616" y="430" width="245" height="140" rx="14" fill="#0d2336" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="636" y="458" fill="#f0f9ff" font-size="15" font-weight="700">Linux / Cloud · @gpu-box</text>
    <text x="636" y="482" fill="#94a3b8" font-size="12.5">Python / LangGraph / Scripts</text>
    <text x="636" y="504" fill="#cbd5e1" font-size="12.5">• @agent.on_invoke decorator</text>
    <text x="636" y="524" fill="#cbd5e1" font-size="12.5">• Crash-safe JSONL journal</text>
    <text x="636" y="552" fill="#22d3ee" font-size="11.5" font-weight="600">pip install anylink-agent (PyPI)</text>

    <!-- MCP -->
    <rect x="894" y="430" width="246" height="140" rx="14" fill="#0d2336" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="914" y="458" fill="#f0f9ff" font-size="15" font-weight="700">Claude Code / Cursor</text>
    <text x="914" y="482" fill="#94a3b8" font-size="12.5">Zero-Code MCP Integration</text>
    <text x="914" y="504" fill="#cbd5e1" font-size="12.5">• Shared cloud memory tools</text>
    <text x="914" y="524" fill="#cbd5e1" font-size="12.5">• Direct cross-device invoke</text>
    <text x="914" y="552" fill="#22d3ee" font-size="11.5" font-weight="600">@anylink-agent/mcp (stdio)</text>
  </g>

  <text x="600" y="600" text-anchor="middle" fill="#64748b" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5">Each edge node manages ONLY its own local environment · Memory &amp; boundaries flow naturally through the Cloud Memory Brain</text>
</svg>
