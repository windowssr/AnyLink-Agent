<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}body{display:grid;place-items:center;font-family:system-ui;color:#4c7c96}.companion{width:65%;max-width:330px;transform:translateY(-18%);text-align:center}.orb{position:relative;aspect-ratio:1;border-radius:38%;background:linear-gradient(150deg,#b8f1ff,#6dabc9 65%,#49728e);box-shadow:inset 12px 16px 30px #ffffff99,0 24px 60px #6fa8cb40;animation:breathe 5s ease-in-out infinite}.face{position:absolute;inset:30% 16%;border-radius:40%;background:#18394edb;display:flex;align-items:center;justify-content:center;gap:20%}.eye{width:10%;height:25%;background:#c4f5ff;border-radius:50%;box-shadow:0 0 16px #9deaff}.link{position:absolute;inset:-14%;border:1px solid #67b7d66b;border-radius:50%;transform:rotate(-25deg) scaleY(.65)}p{font-size:12px;line-height:1.7;opacity:.7;margin-top:44px}.listening .orb{box-shadow:0 0 0 12px #83c9eb30,0 24px 60px #6fa8cb40}.thinking .eye,.working .eye{height:12%;animation:pulse 1s infinite alternate}.speaking .face{animation:speak .28s infinite alternate}.attention .orb{background:linear-gradient(150deg,#dcecff,#a5b6e5,#8593be)}.paused *,.reduced *{animation:none!important}@keyframes breathe{50%{transform:translateY(-8px) rotate(2deg)}}@keyframes pulse{to{opacity:.35}}@keyframes speak{to{transform:scaleY(1.08)}}
</style></head><body><div class="companion"><div class="orb"><div class="link"></div><div class="face"><i class="eye"></i><i class="eye"></i></div></div><p>AnyLink 开源版<br>可在自行配置后使用第三方形象</p></div><script src="./public-avatar.js"></script></body></html>
