[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "anylink-agent"
version = "0.9.1"
description = "Python SDK for AnyLink Protocol v3.2 — Personal Agent Network with Cloud Memory Brain, Multi-Model Gateway, resilient WebSocket bus, interactive tasks, and binary artifacts"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["agent", "personal-agent", "memory", "llm", "websocket", "protocol", "anylink"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx>=0.27.0",
  "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/windowssr/AnyLink-Agent"
Repository = "https://github.com/windowssr/AnyLink-Agent"
Issues = "https://github.com/windowssr/AnyLink-Agent/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/anylink"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
